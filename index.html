<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          
    <title>Tela de Login</title>
</head>

<body class="bg-black text-white d-flex justify-content-center align-items-center vh-100">

    <form>
        <div class="text-center p-4 rounded w-100" style="max-width:400px;">

            <h2 class="mb-4" id="title">Nome do <br>produto</h2>

            <div class="mb-2 text-start">
                <label class="form-label">Name</label>
                <input class="form-control bg-dark text-white" type="text" placeholder="Name">
            </div>

            <div class="mb-2 text-start">
                <label class="form-label">Email</label>
                <input class="form-control bg-dark text-white" type="email" placeholder="Email">
            </div>

            <div class="mb-5 text-start">
                <label class="form-label">Password</label>
                <input class="form-control bg-dark text-white" type="password" placeholder="Password">
            </div>

            <button class="btn btn-outline-light w-100">
                Sign Up
            </button>

        </div>
    </form>

</body>
</html>
